# ============================================================
# artifacts.toml — 산출물 대장. **손대장은 이것 하나다** (D-0266)
#
# 파이어레인 `sources.yaml`의 규율을 산출물에 옮긴 것이다. 그쪽 그라운드 룰 셋이
# 그대로 여기 적용된다.
#
#   R2. 재생성 가능성이 `.gitignore`의 근거다
#       `var/`는 전부 ignore된다. 다시 만들 수 있어서 제외하는 것이며,
#       **다시 만들 수 없는 것을 ignore하면 그 파일은 사실상 소실된다.**
#       그래서 `regen = "불가"`인 계열은 `store = true`가 강제된다.
#
#   R3. 등록되지 않은 산출물은 없는 산출물이다
#       여기 없는 계열이 `var/`에 있으면 **격리 대상**이다. 새 계열을 내기 전에
#       대장부터 쓴다.
#
#   R4. `reads`를 못 채우면 남길 이유가 없다
#       모든 계열은 «누가 읽나»를 든다. 못 채우면 `reads = ["미투입 — <언제 쓸지>"]`로
#       명시하고 산다. **문제는 모은 데서 안 나오고 안 치운 데서 나온다.**
#
# 칸의 뜻
#   what    무엇인가. 한 줄
#   made    만드는 코드. 실재해야 한다 (검사가 대조한다)
#   regen   다시 만드는 명령. 못 만들면 "불가"이고 그때는 why를 적는다
#   reads   누가 읽나. 명령 이름 · 도구 · 결정 번호
#   store   교두보(외장 SSD)에 있어야 하는가
#
# 수와 크기는 **여기 적지 않는다.** 적으면 낡는다 —
# `python3 tools/check_artifacts.py --audit`이 그때그때 센다.
# ============================================================

[series."scan-*"]
what = "라이브러리 스캔 — 곡마다 태그·스트림 속성 한 줄"
made = "core/hathor/infrastructure/jsonl_scan_store.py"
regen = "cd core && uv run python -m hathor.cli ingest scan"
reads = ["ingest features", "ingest keys", "eval retrieval", "eval clap", "D-0010"]
store = true

