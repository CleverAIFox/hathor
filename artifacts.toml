[series."popularity-listenbrainz.jsonl"]
what = "ListenBrainz 고유 청취자 수 세 줄 — O-66을 닫은 판정의 실물 (D-0216)"
made = "docs/DECISIONS.md"
regen = "폐기"
why = """**만드는 도구를 일부러 없앴다.** D-0215가 `tools/probe_listenbrainz.py`를 만들고
D-0216이 *"삭제 · 망 접점 둘로 복귀"*라고 적었다 — 세 줄 만에 «한국 음악이 비어 있다»는
답이 나왔으므로 도구를 남길 이유가 없었다.

**그래도 파일은 남긴다.** D-0216의 «자료 실물 ListenBrainz 3곡»이 가리키는 그 세 줄이며,
지우면 그 판정의 근거가 사라진다 (D-0265). 파이어레인 §18-3c `retired`와 같은 자리다."""
reads = ["D-0216 (O-66 닫힘의 근거)"]
store = true
state = "폐기"
