[series."taste"]
what = "취향 비교 라벨 — **사람이 답한 것이다** (D-0028)"
made = "core/hathor/infrastructure/jsonl_preference_store.py"
regen = "불가"
why = """사람이 곡 쌍을 보고 답한 라벨이다. 명령으로 다시 만들 수 없고 다시 물으면
같은 답이 안 나온다. **R2가 말하는 «ignore하면 소실되는 파일»이 바로 이것이다** —
`var/`가 전부 ignore되므로 이 계열만 백업 의무가 다르다."""
reads = ["engines/taste (미구현)", "D-0012", "D-0028"]
store = true

[series."eval"]
what = "평가 리포트와 실행 기록 — 결정 기록의 «재현»이 가리키는 자리 (D-0250)"
made = "core/hathor/infrastructure/json_evaluation_store.py"
regen = "각 `eval` 명령을 다시 돌린다. 기록 자체는 실행의 부산물이다"
reads = ["tools/repro_from_artifacts.py", "D-0250", "D-0251"]
store = true
