[series."mert-layers"]
what = "MERT 층별 임베딩 — 취향 벡터의 정본 (D-0027 · D-0181)"
made = "core/hathor/infrastructure/npz_feature_store.py"
regen = "cd core && uv run python -m hathor.cli eval layers"
reads = ["eval retrieval --features", "eval fusion --features", "probe_latent.py", "D-0181"]
store = true
state = "있음"
note = """**결손이 아니다 — 다시 뽑혔다** (D-0350). 사용자 기기 전수에서 **벡터 1004개 ·
348M · 색인 `index.features.jsonl` · 실행 `run-20260928T131459Z`**가 나왔다. 그 아래 옛
문단이 *"지운 적이 있고 다시 안 뽑았다"*라 적고 있었고 **D-0274 이후 어느 판이 다시 뽑았다** —
그 판을 못 찾았으므로 어느 결정이 뽑았는지는 **모른다** (GR-0.5).

옛 판정은 이랬다: *"결손은 여기서 참이다 (O-69 닫힘 · D-0274). `--audit`이 «어디에도 없다»로
판정하고 그것이 맞다."* **지금은 거짓이다.**

읽는 쪽의 **기본값이 여기였던 것**이 O-69였다. 네 자리가 `--features` 없이 이 폴더를 열었고
D-0203이 묶음으로 옮긴 뒤에도 안 따라왔다. 이제 기본값은 `audio`이고 이 폴더는 `--features`로
줄 때만 열린다. `tools/probe_latent.py`는 색인이 있는 폴더를 **찾아서** 열므로 없으면 조용히
비는 대신 있는 이름을 찍는다 — 묶음은 색인이 없어 아직 못 읽는다.

**다시 뽑는 것은 `eval retrieval`에는 중복이다** — 묶음이 `mert/<스템>/<층>`을 이미 담는다.
`probe_latent`에는 중복이 아니다. 그것이 이 계열을 «폐기»로 안 적는 이유다."""


