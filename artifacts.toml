[series."lyrics-8192"]
what = "가사 해시 임베딩 8192차원 — **옛 이름 체계의 산출물이고 실재하는 유일한 가사 축이다**"
made = "core/hathor/interfaces/cli/main.py"
regen = "폐기"
why = """**이름에 차원이 박힌 옛 판이다.** 지금은 `DEFAULT_LYRICS_DIRNAME = "lyrics-hashed"`이고
차원은 이름에 안 들어간다 — 그래서 이 이름을 쓰는 코드가 저장소에 없다.

**실측 2026-09-27: 파일 1009개 · 426.3MB · 최근 2026-08-27** (D-0269). 1004곡 전량이며
`eval_retrieval`이 *"가사 8192 조건은 top-1 0.9174로 미달"*이라 적은 그 조건의 실물이다.
미달이어도 **가사 축의 산출물은 이것 하나뿐이다** — `lyrics-hashed`는 어디에도 없다.

`ingest lyrics`를 다시 돌리면 `lyrics-hashed`로 1024차원이 생긴다. **같은 것이 아니므로
이 계열의 재생성 명령이 아니다.**"""
reads = ["D-0046", "eval retrieval --features <이 폴더> --keys mixture (경로를 손으로 준다)"]
store = true
state = "폐기"

[series."keys-*.keys.jsonl.mix-other"]
what = "조성 산출물에 «mix · other» 짝이 이름으로 박힌 것. **정체가 덜 풀렸다**"
made = "core/hathor/infrastructure/keys_jsonl_store.py"
regen = "불명"
state = "조사중"
why = """**현재 코드가 이 이름을 안 쓴다.** `find_keys_store`는 `*.keys.jsonl`만 훑으므로 이
파일을 아예 못 본다. `load_drift_observations`는 짝(`mix`·`other`)을 **읽는 시점에 인자로**
고르고 이름에 안 박는다 — 옛 판이 이름에 박던 것을 옮긴 흔적으로 보인다.

**그러나 확정하지 않는다.** 작성자가 이 대장에서 네 판 연속 정체를 추론하고 네 번 다
틀렸다 (D-0266 ~ D-0269). 추론을 하나 더 얹는 것보다 **모른다고 세는 것**이 낫다.

무엇을 확인했나 — 현재 코드의 쓰는 자리 없음 · `git log`에 이름 없음 · 크기와 시각은
`--audit`이 찍는다. 남은 것: 어느 판이 이 이름을 썼나. `git log -S` 로 찾는다."""
reads = ["미투입 — 정체가 풀리면 D-0108의 자료인지 가른다"]
store = true


[series.".ingest-keys.lock"]
what = "`ingest keys` 배치 잠금 — 같은 산출물에 둘이 못 쓰게 한다 (D-0077)"
made = "core/hathor/infrastructure/batch_lock.py"
regen = "cd core && uv run python -m hathor.cli ingest keys"
reads = ["ingest keys", "D-0077", "D-0278"]
store = false
state = "임시"
why = """**산출물이 아니다.** `flock`은 열린 파일 기술자에 붙는 잠금이라 **파일을 지우지
않는다** — 커널이 fd 수명에 묶어 관리하므로 프로세스가 어떻게 죽든 잠금은 풀리고 파일만
남는다. 한 번도 안 돌린 기기에는 없고 한 번 돌린 기기에는 남으므로 «있음»도 «미생성»도
그것을 말하지 못한다.

**지워서 없애지 않는다** (D-0278). `release()`에서 unlink하면 등재할 것이 사라지지만 그것은
R3가 금지하는 자리이고 **사실상 격리와 이름만 다르다.**

`store = false`가 강제된다 — 잠금을 교두보에 복사해 오면 **없는 배치의 잠금**이 된다."""
