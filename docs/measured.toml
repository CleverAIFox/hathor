# **실측 집계의 정본** (D-0366).
#
# 기획서의 실측 표는 `MASTER.md`에 **손으로 타이핑돼 있었다.** 세는 도구는 있었다 —
# `probe_id3.py`가 1004곡을 전수로 세고 사람이 읽는 글을 찍었고 **사람이 그 수를
# MASTER로 옮겼다.** 옮겨 적은 수는 낡는다 (GR-0.7 · D-0361의 «계약 5종»과 같은 꼴).
#
# ### 센 것과 적은 것을 가른다
#
# `counts`는 **도구가 센 수**다. `display`는 **사람이 정한 표시·용도**다. 표의 백분율은
# 둘을 합쳐 `tools/measured.py`가 **계산해서** 낸다 — 여기 백분율을 적지 않는다.
# 적으면 그것이 또 옮겨 적기다.
#
# ### 왜 집계만 커밋하나
#
# 원본은 `var/`에 있고 `var/`는 `.gitignore`다. 오디오는 기기를 떠나지 않는다
# (D-0015 · D-0134). **여기 있는 것은 수뿐이다** — 곡명 · 경로 · 아티스트 문자열 ·
# 임베딩 · 곡별 행이 없다. 그 경계는 **사람이 지킨다**: 이 파일에 문자열 목록을 넣는
# 순간 검사가 아니라 사람이 막아야 하는 것이 된다.
#
# ### 이 수는 **재어진 수**다 (D-0366 → D-0367)
#
# 처음 넣은 값은 MASTER에 남아 있던 **백분율에서 거꾸로 푼 것**이었다 — 전수가 1004곡
# 이므로 각 백분율을 내는 정수는 대개 하나다(`62.8%` → 631 하나). 작성자가 그 자리에서
# 한 번 틀렸다(630 → 62.7%).
#
# **2026-10-04에 그의 기기에서 `--emit`을 돌렸고 「바뀐 수가 없다」가 나왔다** — 복원이
# 한 자리도 안 틀렸다. 그 전까지 이 수는 「복원」이었고 이제 「실측」이다.
#
#     python3 tools/probe_id3.py --emit      # 기기에서. counts만 다시 쓴다
#     python3 tools/measured.py --fix        # MASTER 거울을 다시 쓴다
#     python3 tools/measured.py --check      # 정본 ↔ 거울

