[project]
name = "hathor"
version = "0.0.0"
description = "취향 잠재 표현 기반 종단간 AI 음악 창작 시스템"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
    # 도메인 포트가 파형·임베딩 타입에 쓴다 (D-0021). 선택적일 수 없다.
    "numpy>=2.0",
]

[project.optional-dependencies]
music = [
  "mutagen>=1.47",
  "numpy>=2.0",
]
# 리전(GPU)에서만 설치한다. 광인사는 코드 작성용이며 2GB를 받을 이유가 없다.
# 구현체가 메서드 안에서 임포트하므로 없어도 모듈 임포트와 게이트가 돈다.
gpu = [
  "torch>=2.5",
  "demucs>=4.0",
  "transformers>=4.46",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "import-linter>=2.1",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hathor"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# N802: 한글 테스트 함수명은 ruff의 islower() 판정에 걸리지 않는다. 오탐이다.
"tests/*" = ["ANN", "N802", "RUF001", "RUF002", "RUF003"]
# 전각 괄호·쉼표·앰퍼샌드는 한국어 음원 태그 실측에서 나오는 실제 구분자다.
# 반각으로 바꾸면 파싱이 깨지므로 RUF001을 끈다 (D-0014).
"hathor/domain/entities/parsed_artist.py" = ["RUF001"]
"hathor/domain/services/artist_name_parser.py" = ["RUF001"]
"hathor/domain/services/title_annotation.py" = ["RUF001", "RUF002"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true

# torch·demucs·transformers는 리전(GPU)에서만 필요하다. 광인사는 코드
# 작성용이며 2GB 라이브러리를 요구하면 게이트가 무거워진다. 구현체가
# 메서드 안에서 임포트하므로 모듈 임포트만으로는 필요하지 않다.
[[tool.mypy.overrides]]
module = ["torch.*", "demucs.*", "transformers.*"]
ignore_missing_imports = true
warn_unreachable = true
disallow_any_generics = true

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["hathor"]

# ------------------------------------------------------------------ import-linter
# GR-2.3 의존성 방향 강제. 위반 시 CI 실패.
[tool.importlinter]
root_package = "hathor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "도메인은 외부를 모른다"
type = "forbidden"
source_modules = ["hathor.domain"]
forbidden_modules = [
  "hathor.application", "hathor.engines", "hathor.infrastructure",
  "hathor.interfaces", "hathor.shared",
  # numpy 제외 (D-0021). 파형은 본질적으로 수치 배열이고 이를 표현할
  # 파이썬 표준 타입이 달리 없다. list[float]은 533만 샘플에서 메모리가
  # 20배로 늘어 성립하지 않는다. torch는 교체 가능한 선택이므로 계속 막는다.
  "sqlalchemy", "fastapi", "torch", "pydantic",
]

[[tool.importlinter.contracts]]
name = "애플리케이션은 구현체를 모른다"
type = "forbidden"
source_modules = ["hathor.application"]
forbidden_modules = ["hathor.infrastructure", "hathor.interfaces"]

[[tool.importlinter.contracts]]
name = "엔진 간 직접 호출 금지"
type = "independence"
modules = [
  "hathor.engines.ingest",
  "hathor.engines.corpus",
  "hathor.engines.taste",
  "hathor.engines.compose",
  "hathor.engines.lyrics",
  "hathor.engines.arrange",
  "hathor.engines.vocal",
  "hathor.engines.score",
  "hathor.engines.artwork",
  "hathor.engines.quality",
]

[[tool.importlinter.contracts]]
name = "계층 순서"
type = "layers"
layers = [
  "hathor.interfaces",
  "hathor.application",
  "hathor.engines",
  "hathor.domain",
]
