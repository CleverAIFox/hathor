[project]
name = "hathor"
version = "0.0.0"
description = "취향 잠재 표현 기반 종단간 AI 음악 창작 시스템"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
    # 도메인 포트가 파형·임베딩 타입에 쓴다 (D-0021). 선택적일 수 없다.
    "numpy>=2.0",
]

[project.optional-dependencies]
music = [
  "mutagen>=1.47",
  "numpy>=2.0",
]
# 리전(GPU)에서만 설치한다. 광인사는 코드 작성용이며 2GB를 받을 이유가 없다.
# 구현체가 메서드 안에서 임포트하므로 없어도 모듈 임포트와 게이트가 돈다.
gpu = [
  "torch>=2.5",
  "demucs>=4.0",
  "transformers>=4.46",
  "scipy>=1.14",
  # 음고 추적 (D-0203). `numba`·`scikit-learn`이 딸려 오므로 가볍지 않지만,
  # CQ 격자 argmax는 **음고 추적이 아니라 우세 격자 찾기**이며 옥타브 오류를
  # 거르지 못한다. 실측으로 곡당 8초라 감당된다.
  "librosa>=1.0",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  # 워크플로 린트 (D-0225). YAML 문법 너머 — 표현식 · 액션 참조 · 러너 라벨 · 셸 인젝션.
  "actionlint-py>=1.7",
  # actionlint가 `run:` 셸을 이것으로 본다. CI 러너에는 시스템에 있고 WSL에는 없다 —
  # 묶음에 넣어야 로컬과 CI가 같은 것을 본다.
  "shellcheck-py>=0.10",
]
# 기획서 빌드 (D-0221). `make proposal`만 쓴다 — 검사와 시험은 이것 없이 돈다.
# 시스템에 graphviz(`dot`)와 한글 글꼴이 더 필요하다.
docs = [
  "matplotlib>=3.9",
  "python-docx>=1.1",
  "pypandoc-binary>=1.13",
]
# 실험 추적 · 흐름 (D-0224). `make mlflow-sync` · `make flow`만 쓴다 — 검사와 시험은 이것
# 없이 돈다. 서버는 Compose `ml` 프로파일이다. 클라이언트와 서버 이미지(`docker/mlflow`)의
# 주 버전을 맞춘다. 2.x는 `packaging`을 24로 끌어내려 3으로 간다.
mlops = [
  "mlflow-skinny>=3.0,<4",
  "prefect>=3.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hathor"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# N802: 한글 테스트 함수명은 ruff의 islower() 판정에 걸리지 않는다. 오탐이다.
"tests/*" = ["ANN", "N802", "RUF001", "RUF002", "RUF003"]
# 전각 괄호·쉼표·앰퍼샌드는 한국어 음원 태그 실측에서 나오는 실제 구분자다.
# 반각으로 바꾸면 파싱이 깨지므로 RUF001을 끈다 (D-0014).
"hathor/domain/entities/parsed_artist.py" = ["RUF001"]
"hathor/domain/services/artist_name_parser.py" = ["RUF001"]
"hathor/domain/services/title_annotation.py" = ["RUF001", "RUF002"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true

# torch·demucs·transformers는 리전(GPU)에서만 필요하다. 광인사는 코드
# 작성용이며 2GB 라이브러리를 요구하면 게이트가 무거워진다. 구현체가
# 메서드 안에서 임포트하므로 모듈 임포트만으로는 필요하지 않다.
[[tool.mypy.overrides]]
module = ["torch.*", "demucs.*", "transformers.*", "scipy.*", "librosa.*"]
ignore_missing_imports = true
warn_unreachable = true
disallow_any_generics = true

# GPU 엑스트라가 없는 기기에서는 torch 스텁이 없어 이 파일의 `type: ignore`가
# 불필요해 보인다. **환경 차이이며 결함이 아니다** (D-0061). 전역으로 끄지 않고
# 이 모듈에서만 끈다 — 다른 곳의 죽은 ignore는 계속 잡아야 한다.
[[tool.mypy.overrides]]
module = ["hathor.infrastructure.mert_feature_extractor"]
warn_unused_ignores = false

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["hathor"]

[tool.coverage.report]
# 바닥의 정본은 여기 하나다 (D-0223). Makefile · CI에 숫자를 적지 않는다.
# 올릴 때는 손으로 고치지 않고 `make cov-bump`를 쓴다 — 실측 - 1로 올린다.
fail_under = 87

# ------------------------------------------------------------------ import-linter
# GR-2.3 의존성 방향 강제. 위반 시 CI 실패.
[tool.importlinter]
root_package = "hathor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "도메인은 외부를 모른다"
type = "forbidden"
source_modules = ["hathor.domain"]
forbidden_modules = [
  "hathor.application", "hathor.engines", "hathor.infrastructure",
  "hathor.interfaces", "hathor.shared",
  # numpy 제외 (D-0021). 파형은 본질적으로 수치 배열이고 이를 표현할
  # 파이썬 표준 타입이 달리 없다. list[float]은 533만 샘플에서 메모리가
  # 20배로 늘어 성립하지 않는다. torch는 교체 가능한 선택이므로 계속 막는다.
  "sqlalchemy", "fastapi", "torch", "pydantic",
]

[[tool.importlinter.contracts]]
# 오디오 비이동 (D-0015 · D-0134). 망을 타는 유일한 모듈이 오디오를 만질 수 있는
# 것들을 **임포트조차 못 하게** 한다. D-0015가 요구한 "타입 수준의 불가능"을
# 서버가 없는 지금 구현할 수 있는 형태다. 접점의 개수는 tools/check_egress.py가 센다.
name = "송신부는 오디오를 모른다"
type = "forbidden"
source_modules = ["hathor.infrastructure.musicbrainz_lookup"]
forbidden_modules = [
  "hathor.domain.ports.audio_analysis",
  "hathor.domain.entities.audio_stream",
  "hathor.infrastructure.ffmpeg_audio_decoder",
  "hathor.infrastructure.demucs_separator",
  "hathor.infrastructure.mert_feature_extractor",
  "hathor.infrastructure.mfcc_feature_extractor",
]

[[tool.importlinter.contracts]]
name = "애플리케이션은 구현체를 모른다"
type = "forbidden"
source_modules = ["hathor.application"]
forbidden_modules = ["hathor.infrastructure", "hathor.interfaces"]

[[tool.importlinter.contracts]]
name = "엔진 간 직접 호출 금지"
type = "independence"
modules = [
  "hathor.engines.ingest",
  "hathor.engines.corpus",
  "hathor.engines.taste",
  "hathor.engines.compose",
  "hathor.engines.lyrics",
  "hathor.engines.arrange",
  "hathor.engines.vocal",
  "hathor.engines.score",
  "hathor.engines.artwork",
  "hathor.engines.quality",
]

[[tool.importlinter.contracts]]
name = "계층 순서"
type = "layers"
layers = [
  "hathor.interfaces",
  "hathor.application",
  "hathor.infrastructure",
  "hathor.engines",
  "hathor.domain",
]
# **`infrastructure`가 계약에 없어 역방향이 안 잡혔다** (D-0190). `keys_jsonl_store`가
# 함수 안에서 응용을 불렀고 그것이 런타임 역전이었다 — `chroma_drift`를 도메인으로
# 내려 끊었다.
#
# 남은 다섯은 **`TYPE_CHECKING` 안이며 저장소가 담는 DTO의 타입만 빌린다.** 성격이
# 다르므로 이름으로 적어 둔다 — **예외가 목록이면 빚이 보이고, 계약이 없으면 안 보인다.**
# 갚는 방향은 그 DTO들을 도메인으로 내리는 것이고 PLAN §3에 적었다.
ignore_imports = [
  "hathor.infrastructure.npz_feature_store -> hathor.application.extract_features",
  "hathor.infrastructure.jsonl_scan_store -> hathor.application.scan_library",
  "hathor.infrastructure.jsonl_scan_store -> hathor.application.scan_summary",
  "hathor.infrastructure.jsonl_resolution_store -> hathor.application.resolution_summary",
  "hathor.infrastructure.jsonl_resolution_store -> hathor.application.resolve_identities",
]
