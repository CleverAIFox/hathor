# **실측 집계의 정본** (D-0366).
#
# 기획서의 실측 표는 `MASTER.md`에 **손으로 타이핑돼 있었다.** 세는 도구는 있었다 —
# `probe_id3.py`가 1004곡을 전수로 세고 사람이 읽는 글을 찍었고 **사람이 그 수를
# MASTER로 옮겼다.** 옮겨 적은 수는 낡는다 (GR-0.7 · D-0361의 «계약 5종»과 같은 꼴).
#
# ### 센 것과 적은 것을 가른다
#
# `counts`는 **도구가 센 수**다. `display`는 **사람이 정한 표시·용도**다. 표의 백분율은
# 둘을 합쳐 `tools/measured.py`가 **계산해서** 낸다 — 여기 백분율을 적지 않는다.
# 적으면 그것이 또 옮겨 적기다.
#
# ### 왜 집계만 커밋하나
#
# 원본은 `var/`에 있고 `var/`는 `.gitignore`다. 오디오는 기기를 떠나지 않는다
# (D-0015 · D-0134). **여기 있는 것은 수뿐이다** — 곡명 · 경로 · 아티스트 문자열 ·
# 임베딩 · 곡별 행이 없다. 그 경계는 **사람이 지킨다**: 이 파일에 문자열 목록을 넣는
# 순간 검사가 아니라 사람이 막아야 하는 것이 된다.
#
# ### 어느 블록이 재어졌나 (D-0366 → D-0367 → D-0371)
#
# 처음 넣은 값은 MASTER에 남아 있던 **백분율에서 거꾸로 푼 것**이었다 — 전수가 1004곡
# 이므로 각 백분율을 내는 정수는 대개 하나다(`62.8%` → 631 하나). 작성자가 그 자리에서
# 한 번 틀렸다(630 → 62.7%).
#
# **마지막 실측일은 블록마다 `stamp`에 있다.** 여기 표로 또 적지 않는다 — D-0371이
# 그렇게 적었고 그것이 **옮겨 적기**였다 (GR-0.7 · D-0373). `--emit`이 날짜를 쓰고
# `measured.py`가 그것을 MASTER 표 아래에 찍는다.
#
# D-0366은 *«artist 집계 6개는 아직 상류가 없다»*라고 적었다. **`corpus` 여덟도
# 없었다** — 세 블록 중 둘이었고 세어 보지 않고 적은 수다 (GR-0.5 · D-0371).
# 이제 `measured.check_upstream()`이 **양방향**으로 본다: 아무도 안 세는 수와
# 세고도 버리는 수를 둘 다 잡는다.
#
# ### 2026-10-05 전수에서 바뀐 수는 **하나**다
#
# `corpus.seconds` 230616 → 230626. **`bytes`는 안 바뀌었다** — 파일이 그대로라는
# 뜻이고, 따라서 **음원이 아니라 자가 바뀐 것**이다. 1004곡에 10초, 곡당 0.01초이고
# 「총 재생시간」은 시간 단위(64.1h)라 **표에서는 안 보인다.** 옛 수가 어떻게 나왔는지는
# 기록이 없다 — 지금 자는 `round(MP3.info.length)`의 합이다 (D-0373).
#
#     make measure                           # 기기에서. 둘 다 다시 재고 거울을 맞춘다
#     python3 tools/measured.py --check      # 정본 ↔ 거울 ↔ 상류 ↔ **자의 이름**
#
# ### 자에도 이름이 있다 (D-0374)
#
# `ruler`는 **그 수를 낸 자의 이름**이다. 세는 법을 바꾸면 도구의 `*_RULER`를 바꾸고,
# 그러면 `measured --check`이 *«세는 법이 바뀌었고 다시 안 쟀다»*로 운다. 2026-10-05에
# `seconds`가 10초 움직였을 때 **옛 수가 어떤 자로 나왔는지 기록이 없어서** 음원인지
# 자인지 가르는 데 `bytes`를 봐야 했다 (D-0373).

