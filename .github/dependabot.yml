# 의존성 갱신 제안 (D-0223). 잠금(`uv.lock`)이 재현성을 지키고, 이것이 낡음을 알린다.
#
# 한 주에 한 번, 묶어서 낸다. PR마다 CI가 돌고 초록일 때만 받는다 — 판단은 사람이 한다.
# GPU 묶음(torch · demucs · transformers)은 CI가 GPU 없이 도는 만큼 초록이어도
# 실기기에서 깨질 수 있다. 그 셋은 주 버전을 자동으로 올리지 않는다.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/core"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "demucs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
