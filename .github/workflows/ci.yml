name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: core

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: Lint & format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy hathor --strict

      - name: Architecture boundary
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov=hathor --cov-fail-under=75 -q

      - name: Dependency vulnerabilities
        run: uv run pip-audit --strict || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --dev

      - name: Deterministic generation check
        run: |
          uv run python -m hathor.cli generate \
            --seed 42 --dry-run --stages structure,harmony --out /tmp/a.json
          uv run python -m hathor.cli generate \
            --seed 42 --dry-run --stages structure,harmony --out /tmp/b.json
          python - <<'PY'
          import json, sys
          a = json.load(open("/tmp/a.json")); b = json.load(open("/tmp/b.json"))
          a.pop("job"); b.pop("job")          # job_id는 UUID이므로 비교에서 제외
          sys.exit(0 if a == b else "재현성 위반: 동일 시드에서 산출물이 다르다")
          PY
