# **러너를 고정한다** (D-0330). `ubuntu-latest`는 2026-10-19부터 Ubuntu 26으로 옮겨 가고,
# 그러면 ffmpeg · 시스템 라이브러리 · 파이썬 패치가 **한 번에** 바뀐다. 이 파일의 잡 하나가
# `reproducibility`라는 이름을 달고 있는데 **그 잡이 안 고정된 라벨 위에 서 있었다.**
#
# `uv.lock`을 리눅스 x86_64 하나로 못 박아 둔 저장소다 (D-0227). 잠금을 좁혀 놓고 러너
# 이미지를 떠다니게 두면 **무엇이 재현된 것인지 알 수 없다.**
#
# 올릴 때는 **결정 기록으로 올린다** — 날짜가 와서 저절로 바뀌는 것과 사람이 바꾸는 것은
# 다르다. `core/tests/unit/test_hygiene.py`가 이 고정을 지킨다.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # 배포가 이 검사를 그대로 부른다 (proposal.yml · D-0222)
  workflow_call:

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: core

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      # `check_patch`가 `HEAD`를 패치로 뽑아 보려면 **부모가 있어야 한다** (D-0352)
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # **로컬 `make sync`와 같은 것을 깐다** (D-0254). `--dev`만 깔았더니
      # `python-docx`(docs 그룹)를 쓰는 D-0246의 시험 둘이 여기서만 죽었다.
      - run: uv sync --all-extras --all-groups

      # **먼저 돈다.** 그물이 줄어 있으면 아래 전부의 초록이 뜻이 없다 (D-0349).
      - name: Gate field of view
        working-directory: .
        run: python3 tools/check_sight.py --check

      - name: Decision records
        working-directory: .
        run: python3 tools/check_decisions.py --check

      - name: Closed issue mentions
        working-directory: .
        run: python3 tools/check_issue_mentions.py --check

      - name: Doc layout
        working-directory: .
        run: python3 tools/check_doc_style.py --check

      - name: Retired words
        working-directory: .
        run: python3 tools/check_retired.py --check

      - name: Requirement conventions
        working-directory: .
        run: python3 tools/check_requirements.py --check

      - name: Caller/callee arguments
        working-directory: .
        run: python3 tools/check_args.py --check

      # **뽑는 쪽도 본다** (D-0352). `make patch`가 망가지면 다음 패치를 뽑을 때 알게 되고
      # 그때는 받는 쪽에서 터진다 — D-0350이 그 꼴이다. `HEAD`를 실제로 뽑아 보므로
      # **부모가 있어야 한다** — 그래서 이 잡은 `fetch-depth: 2`로 받는다. 얕으면 못
      # 돌렸다고 화면에 적는다 (GR-0.5).
      - name: Patch heads and pulling
        working-directory: .
        run: python3 tools/check_patch.py --check

      # **느슨해진 래칫은 초록으로 위장한다** (D-0352). 못의 값을 부모 커밋과 대조하므로
      # 여기도 부모가 필요하다 (`fetch-depth: 2`).
      - name: Ratchet direction
        working-directory: .
        run: python3 tools/check_ratchets.py --check

      - name: Egress points
        working-directory: .
        run: python3 tools/check_egress.py --check

      - name: Forbidden by decision
        working-directory: .
        run: python3 tools/check_forbidden.py --check

      - name: Compose memory
        working-directory: .
        run: python3 tools/check_compose.py --check

      # D-0266. 대장 자신만 본다 — 디스크를 안 읽으므로 산출물이 없는 러너에서도 돈다.
      # 실물 대조(`--audit`)는 `make hygiene`이 기기에서 부른다.
      - name: Artifact ledger
        working-directory: .
        run: python3 tools/check_artifacts.py --check

      - name: Model licenses
        working-directory: .
        run: python3 tools/check_model_licenses.py --check

      - name: Proposal vs sources
        working-directory: .
        run: python3 tools/docx_check.py --check

      - name: Doc reality check
        working-directory: .
        run: python3 tools/doc_fsck.py --check

      - name: Secret scan
        working-directory: .
        run: python3 tools/check_secrets.py --check

      - name: Encoding & newlines
        working-directory: .
        run: python3 tools/encoding_check.py --check

      # D-0230. 검사가 죽었는지 세는 래칫. 양성 대조는 pytest가 돈다 — 관문은 이 수다.
      - name: Dead check ratchet
        working-directory: .
        run: python3 tools/deadcheck.py --ratchet

      - name: File size ratchet
        working-directory: .
        run: python3 tools/check_file_size.py

      - name: Test type ratchet
        working-directory: .
        run: python3 tools/check_test_types.py --check

      - name: Lint & format
        run: |
          uv run ruff check . ../tools
          uv run ruff format --check . ../tools

      # D-0225. 워크플로는 머지되기 전에 문법조차 안 보였다. shellcheck는 dev 묶음에서 온다 —
      # 러너의 시스템 판이 아니라 로컬과 같은 판을 쓴다.
      - name: Workflow & shell lint
        run: |
          uv run actionlint
          uv run shellcheck -S warning ../tools/*.sh ../.githooks/pre-commit ../.devcontainer/*.sh

      - name: Type check
        run: uv run mypy hathor --strict --cache-dir .mypy_cache_src

      # D-0263. 관문 도구가 타입 검사 밖이었다. `ship.py`의 `GREEN`이 문자열에서 튜플로
      # 덮여 여덟 판이 머리글에 튜플을 찍었고, **이 한 줄이 있었으면 첫 판에서 잡혔다.**
      - name: Gate tool type check
        run: uv run mypy ../tools --strict --cache-dir .mypy_cache_tools

      - name: Architecture boundary
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov=hathor -q -n auto --dist loadgroup

      - name: Coverage ratchet
        working-directory: .
        run: python3 tools/check_coverage.py

      # 상류 패키지의 취약점은 이 저장소가 고칠 수 없다. 막지 않고 노란불로 알린다 (D-0219).
      # `|| true`였을 때는 취약점이 있어도 초록이라 **알림조차 아니었다.**
      #
      # **잠금에서 뽑아 넘긴다** (D-0348). `pip-audit --strict`를 환경에 바로 걸면
      # `hathor` 자신을 PyPI에서 못 찾아 **첫 줄에서 죽고 취약점 요약조차 안 찍었다** —
      # 노란불이 늘 켜져 있었고 **진짜 취약점과 안 갈렸다** (GR-0.8). `--skip-editable`도
      # 안 통한다: `--strict`가 건너뛰기도 실패로 센다. `--no-emit-project`가 그 줄을
      # 아예 안 뽑으므로 **`--strict`가 비로소 실질을 갖는다.**
      # ci-only: pip-audit 로컬 `make check`은 망을 안 탄다. 취약점 DB 조회는 CI에서만 한다
      # advisory: pip-audit 상류 취약점은 우리가 못 고친다. 실패를 노란불로만 본다
      - name: Dependency vulnerabilities
        continue-on-error: true
        run: |
          uv export --format requirements-txt --no-emit-project \
            --all-extras --all-groups --no-hashes -q -o /tmp/audit.txt
          uv run pip-audit --strict -r /tmp/audit.txt

  # **한 갈래로는 안 보이는 결함이 있다** (D-0355). D-0354가 그랬다 — `make check`은
  # 관문을 하나씩 차례로 돌고, 이 잡도 단계마다 하나씩 돈다. 그래서 **일부러 한꺼번에**
  # 돌리는 자리를 따로 둔다. 나란히 도므로 벽시계로는 공짜다.
  gates-under-load:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --all-groups
        working-directory: core
      # ci-only: check_under_load.py 관문 전부를 한 번 더 돈다. `make check`에 넣으면 두 배가 되고, 그러면 사람이 검사를 끈다 (D-0129)
      - name: Gates under load
        run: python3 tools/check_under_load.py --check

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproducibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --dev

      # ci-only: hathor.cli 새 환경에 설치한 CLI를 두 번 돌려 산출물을 대조한다.
      #   로컬 pytest는 함수 단위만 본다 (`test_determinism.py`) — 설치·진입점은 여기서만 탄다
      - name: Deterministic generation check
        run: |
          uv run python -m hathor.cli generate \
            --seed 42 --dry-run --stages structure,harmony --out /tmp/a.json
          uv run python -m hathor.cli generate \
            --seed 42 --dry-run --stages structure,harmony --out /tmp/b.json
          python - <<'PY'
          import json, sys
          a = json.load(open("/tmp/a.json")); b = json.load(open("/tmp/b.json"))
          a.pop("job"); b.pop("job")          # job_id는 UUID이므로 비교에서 제외
          sys.exit(0 if a == b else "재현성 위반: 동일 시드에서 산출물이 다르다")
          PY
