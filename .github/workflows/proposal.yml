# 기획서를 GitHub Pages로 배포한다 (D-0222).
#
# 정본은 docs/MASTER.md Part I ~ III이고 docs/proposal.docx는 그것을 빌드한 판이다 (D-0221).
# 사본을 커밋하지 않고 배포 직전에 _site/로 옮긴다 — 두 벌이 커밋되면 한쪽만 고쳐진다.
# 웹에서 보여 주는 것은 여기서 구운 PDF다 (D-0229). 구운 판이 깨졌는지는 쪽수와 본문 글자로 본다.
#
# 배포는 검사를 지난다. ci.yml을 그대로 부른다 — 푸시가 통과한 것과 같은 검사여야
# 게이트가 문다 (fire-lane _deploy.yml). 검사를 여기 복사하면 둘이 갈린다.
#
# 한 번은 손으로 켠다 — 저장소 설정 → Pages → Source: GitHub Actions
#   gh api -X POST repos/CleverAIFox/hathor/pages -f build_type=workflow
name: proposal

on:
  push:
    branches: [main]
    paths:
      - 'docs/proposal.docx'
      - 'docs/MASTER.md'
      - 'site/**'
      - 'tools/render_proposal.py'
      - 'tools/proposal_source.py'
      # **생성기가 바뀌면 제출본이 낡는다** (D-0376). 제출본을 다시 안 낸 판은
      # `docs/proposal.docx`가 그대로라 예전에는 이 워크플로가 **안 돌았다** —
      # 막을 자리에 닿지도 못했다. 자물쇠가 보는 것을 여기서도 본다.
      - 'tools/build_proposal.py'
      - 'tools/proposal_body.py'
      - 'tools/render_figures.py'
      - 'tools/render_charts.py'
      - 'docs/proposal.lock.json'
      - '.github/workflows/proposal.yml'
  workflow_dispatch:

# 재사용 워크플로에는 호출자보다 큰 권한이 안 간다. 배포 권한은 여기서 준다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      # `site/index.html`이 `proposal.html`로 넘긴다. 뒤에 경로를 붙이면 배포가
      # 실패한 날 `page_url`이 비어 **「proposal.html은 http(s) URL이 아니다」**가 뜬다.
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # **`bake_proposal`이 `python-docx`를 쓴다** (D-0256). 이 잡에는 묶음이 없어서
      # D-0246이 이 워크플로를 만든 뒤로 **한 번도 초록인 적이 없었다.**
      - name: Install
        working-directory: core
        run: uv sync --all-extras --all-groups

      # `render_proposal --check`는 `zipfile`만 쓴다 — 맨 `python3`으로 둔다 (D-0368).
      # **`--deploy`가 자물쇠를 문다** (D-0376). 생성기를 고치고 제출본을 다시 안 낸
      # 판은 `make check`과 `gate`를 지나지만 **여기서 멈춘다** — 커밋을 막으면
      # `make apply`가 제가 만든 커밋에 걸린다 (D-0374).
      - name: Proposal vs sources
        run: python3 tools/render_proposal.py --check --deploy
      # D-0229. 브라우저가 docx를 직접 그리던 판은 웹에서 표와 글꼴이 무너졌다.
      # 여기서 한 번 구워 PDF로 보여 준다. 제출본(docx)은 그대로 같이 올린다.
      - name: Install converter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer fonts-noto-cjk poppler-utils graphviz
      - name: Bake PDF
        # **목차에 쪽 번호를 박는다** (D-0246). 두 판을 굽고 쪽이 밀리지 않았는지 확인한다.
        working-directory: core
        run: >
          uv run --no-sync python ../tools/bake_proposal.py
          --docx ../docs/proposal.docx --out ../_site/proposal.pdf
      - name: PDF is not broken
        run: |
          pages=$(pdfinfo _site/proposal.pdf | awk '/^Pages/ {print $2}')
          test "$pages" -ge 50 || { echo "쪽이 $pages장뿐이다 — 굽다가 깨졌다"; exit 1; }
          pdftotext _site/proposal.pdf - | grep -q '취향 잠재 표현' \
            || { echo "PDF에 본문 글자가 없다 — 글꼴이 깨졌다"; exit 1; }
          pdftotext -f 3 -l 3 -layout _site/proposal.pdf - | grep -qE '\.{5,} *[0-9]+' \
            || { echo "목차에 쪽 번호가 없다 (D-0246)"; exit 1; }
          echo "PDF $pages쪽 · 본문 확인"
      # **화면도 생성물이다** (D-0368). 예전엔 `site/proposal.html`이 PDF를 끼워 보여
      # 주는 34줄이었고 **손으로 쓴 것**이었다 (D-0229). 지금은 docx와 **같은
      # 마크다운**에서 나온다 — 두 벌이 될 자리가 없다.
      # **그림은 `var/`에 있고 git은 그것을 안 나른다** (D-0369). 복사하려다 CI에서만
      # 터졌다 — 사본을 옮기는 대신 **같은 정본에서 다시 그린다** (D-0368).
      - name: Draw figures
        working-directory: core
        run: |
          uv run --no-sync python ../tools/render_figures.py --out ../_site/figures
          uv run --no-sync python ../tools/render_charts.py --out ../_site/figures
      - name: Stage site
        run: |
          cp site/proposal.html site/index.html _site/
          cp docs/proposal.docx _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
